services:
  - type: web
    name: atmayantra
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python Atmayantra/manage.py collectstatic --no-input
      python Atmayantra/manage.py migrate
    startCommand: "gunicorn Atmayantra.Atmayantra.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atmayantra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

  - type: pserv
    name: atmayantra-db
    env: postgres
    plan: free
    postgresMajorVersion: 13
